<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Text Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0000;
            --card-bg: #1a0505;
            --border-red: #ff1a40;
            --dark-red: #80001a;
            --bright-red: #ff4d6d;
            --text-main: #ff8095;
            --text-dim: #b3364b;
            --glow-red: 0 0 12px rgba(255, 26, 64, 0.9);
            --display-bg: #000000;
            --display-text: #ffffff;
            --input-text: #ff99aa;
        }

        * {
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle CRT Scanline Effect for High Clarity */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border: 4px solid var(--border-red);
            box-shadow: var(--glow-red), inset 0 0 15px rgba(255, 26, 64, 0.3);
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            margin-top: 0;
            font-size: 1.3rem;
            color: var(--border-red);
            text-shadow: var(--glow-red);
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .display-screen {
            width: 100%;
            min-height: 250px;
            max-height: 400px;
            background-color: var(--display-bg);
            border: 3px solid var(--border-red);
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--display-text);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8), 0 0 12px var(--border-red);
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(255, 26, 64, 0.25);
        }

        /* High-contrast Scrollbar */
        .display-screen::-webkit-scrollbar {
            width: 10px;
        }

        .display-screen::-webkit-scrollbar-track {
            background: #000000;
        }

        .display-screen::-webkit-scrollbar-thumb {
            background: var(--dark-red);
            border: 2px solid var(--border-red);
        }

        .text-input {
            width: 100%;
            height: 120px;
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            border: 2px solid var(--border-red);
            background-color: #000000;
            color: var(--input-text);
            outline: none;
            resize: vertical;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(255, 26, 64, 0.3);
        }

        .text-input::placeholder {
            color: var(--text-dim);
        }

        .text-input:focus {
            border-color: var(--bright-red);
            box-shadow: var(--glow-red);
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            padding: 12px 20px;
            font-size: 0.7rem;
            border: 2px solid var(--border-red);
            background-color: var(--dark-red);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        button:hover {
            background-color: var(--border-red);
            box-shadow: var(--glow-red);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>[LYRIC_DISPLAY_TERMINAL]</h1>

    <div id="display-screen" class="display-screen"></div>

    <textarea id="text-input" class="text-input" placeholder="PASTE LYRICS OR TYPE TEXT HERE..."></textarea>

    <div class="controls">
        <button id="clear-btn">CLEAR DISPLAY</button>
    </div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const displayScreen = document.getElementById('display-screen');
    const clearBtn = document.getElementById('clear-btn');

    const defaultMessage = 'Enter lyrics or text below to display on terminal screen...';
    let typeInterval = null;
    let targetText = defaultMessage;
    let currentIndex = 0;

    // Mid-fast typing pace (~20ms per character)
    const TYPING_SPEED = 20;

    function startTypewriter(text) {
        clearInterval(typeInterval);
        displayScreen.innerText = '';
        targetText = text;
        currentIndex = 0;

        if (targetText.length === 0) return;

        typeInterval = setInterval(() => {
            displayScreen.innerText += targetText.charAt(currentIndex);
            currentIndex++;
            displayScreen.scrollTop = displayScreen.scrollHeight;

            if (currentIndex >= targetText.length) {
                clearInterval(typeInterval);
            }
        }, TYPING_SPEED);
    }

    // Live update with character-by-character animation
    textInput.addEventListener('input', () => {
        const value = textInput.value;
        if (value.trim() === '') {
            startTypewriter(defaultMessage);
        } else {
            startTypewriter(value);
        }
    });

    // Clear display button handler
    clearBtn.addEventListener('click', () => {
        textInput.value = '';
        startTypewriter(defaultMessage);
        textInput.focus();
    });

    // Initialize display on load
    startTypewriter(defaultMessage);
</script>

</body>
</html>
