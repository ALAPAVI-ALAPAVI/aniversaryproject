<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Speed Typer</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050000;
            --card-bg: #120202;
            --border-red: #ff0033;
            --dark-red: #660014;
            --bright-red: #ff3355;
            --text-main: #ff4d4d;
            --text-dim: #881111;
            --glow-red: 0 0 10px rgba(255, 0, 51, 0.8), 0 0 20px rgba(255, 0, 51, 0.4);
            --correct-color: #ff3333;
            --incorrect-bg: #880000;
        }

        * {
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.75) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border: 4px solid var(--border-red);
            box-shadow: var(--glow-red), inset 0 0 15px rgba(255, 0, 51, 0.3);
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--border-red);
            text-shadow: var(--glow-red);
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 25px;
            background-color: #080000;
            border: 2px solid var(--dark-red);
            padding: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--border-red);
            text-shadow: var(--glow-red);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.55rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .text-display {
            font-size: 0.85rem;
            line-height: 1.8;
            margin-bottom: 20px;
            background-color: #000000;
            border: 2px solid var(--dark-red);
            padding: 20px;
            width: 100%;
            word-wrap: break-word;
            min-height: 120px;
            user-select: none;
            color: var(--text-dim);
        }

        .correct {
            color: #ffffff;
            text-shadow: 0 0 5px #ffffff, 0 0 10px var(--border-red);
        }

        .incorrect {
            color: #ff3333;
            background-color: var(--incorrect-bg);
        }

        .current {
            background-color: var(--border-red);
            color: #000000 !important;
            animation: pixel-blink 0.8s infinite;
        }

        @keyframes pixel-blink {
            0%, 49% { background-color: var(--border-red); color: #000; }
            50%, 100% { background-color: transparent; color: var(--text-main); }
        }

        .typing-input {
            width: 100%;
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            border: 2px solid var(--dark-red);
            background-color: #000000;
            color: var(--border-red);
            outline: none;
            margin-bottom: 25px;
            box-shadow: inset 0 0 8px rgba(255, 0, 51, 0.3);
        }

        .typing-input:focus {
            border-color: var(--border-red);
            box-shadow: var(--glow-red);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            padding: 12px 20px;
            font-size: 0.7rem;
            border: 2px solid var(--border-red);
            background-color: var(--dark-red);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        button:hover {
            background-color: var(--border-red);
            box-shadow: var(--glow-red);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 650px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key {
            background-color: #080000;
            border: 1px solid var(--dark-red);
            color: var(--text-dim);
            padding: 10px;
            font-size: 0.6rem;
            min-width: 28px;
            text-align: center;
        }

        .key.space {
            width: 180px;
        }

        .key.active {
            background-color: var(--border-red);
            color: #000000;
            border-color: #ffffff;
            box-shadow: var(--glow-red);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>[PIXEL_TYPER]</h1>

    <div class="stats-bar">
        <div class="stat-item">
            <div id="timer" class="stat-value">60</div>
            <div class="stat-label">TIME LEFT</div>
        </div>
        <div class="stat-item">
            <div id="wpm" class="stat-value">0</div>
            <div class="stat-label">WPM</div>
        </div>
        <div class="stat-item">
            <div id="accuracy" class="stat-value">100%</div>
            <div class="stat-label">ACCURACY</div>
        </div>
    </div>

    <div id="text-display" class="text-display"></div>

    <input type="text" id="typing-input" class="typing-input" placeholder="TYPE HERE TO START..." autofocus autocomplete="off" spellcheck="false">

    <div class="controls">
        <button id="restart-btn">RESTART SYSTEM</button>
    </div>

    <div class="keyboard" id="keyboard">
        <div class="keyboard-row">
            <div class="key" data-key="q">Q</div>
            <div class="key" data-key="w">W</div>
            <div class="key" data-key="e">E</div>
            <div class="key" data-key="r">R</div>
            <div class="key" data-key="t">T</div>
            <div class="key" data-key="y">Y</div>
            <div class="key" data-key="u">U</div>
            <div class="key" data-key="i">I</div>
            <div class="key" data-key="o">O</div>
            <div class="key" data-key="p">P</div>
        </div>
        <div class="keyboard-row">
            <div class="key" data-key="a">A</div>
            <div class="key" data-key="s">S</div>
            <div class="key" data-key="d">D</div>
            <div class="key" data-key="f">F</div>
            <div class="key" data-key="g">G</div>
            <div class="key" data-key="h">H</div>
            <div class="key" data-key="j">J</div>
            <div class="key" data-key="k">K</div>
            <div class="key" data-key="l">L</div>
        </div>
        <div class="keyboard-row">
            <div class="key" data-key="z">Z</div>
            <div class="key" data-key="x">X</div>
            <div class="key" data-key="c">C</div>
            <div class="key" data-key="v">V</div>
            <div class="key" data-key="b">B</div>
            <div class="key" data-key="n">N</div>
            <div class="key" data-key="m">M</div>
        </div>
        <div class="keyboard-row">
            <div class="key space" data-key=" ">SPACE</div>
        </div>
    </div>
</div>

<script>
    const sampleParagraphs = [
        "System breach detected. Initialize countermeasures immediately. Type fast to overwrite corrupt data streams and secure the system.",
        "Retro arcade gaming relies on precise timing and memory management. Pixel graphics combined with fast execution creates timeless retro experiences.",
        "Compilation standard set to C23. Run static code checks and memory sanitizers before executing binary files on local target machines."
    ];

    let timer = 60;
    let timerInterval = null;
    let isPlaying = false;
    let totalTyped = 0;
    let correctTyped = 0;
    let currentText = "";

    const textDisplay = document.getElementById('text-display');
    const typingInput = document.getElementById('typing-input');
    const timerElement = document.getElementById('timer');
    const wpmElement = document.getElementById('wpm');
    const accuracyElement = document.getElementById('accuracy');
    const restartBtn = document.getElementById('restart-btn');

    function initGame() {
        clearInterval(timerInterval);
        timer = 60;
        isPlaying = false;
        totalTyped = 0;
        correctTyped = 0;
        
        timerElement.innerText = timer;
        wpmElement.innerText = '0';
        accuracyElement.innerText = '100%';
        typingInput.value = '';
        typingInput.disabled = false;

        currentText = sampleParagraphs[Math.floor(Math.random() * sampleParagraphs.length)];
        textDisplay.innerHTML = '';

        currentText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            span.innerText = char;
            if (index === 0) span.classList.add('current');
            textDisplay.appendChild(span);
        });

        typingInput.focus();
    }

    function startGame() {
        isPlaying = true;
        timerInterval = setInterval(() => {
            timer--;
            timerElement.innerText = timer;
            calculateStats();

            if (timer <= 0) {
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        clearInterval(timerInterval);
        isPlaying = false;
        typingInput.disabled = true;
        typingInput.value = '';
        textDisplay.innerHTML = `<span style="color: var(--border-red); text-shadow: var(--glow-red);">[SYSTEM OVERRIDE COMPLETE]</span><br><br>FINAL WPM: ${wpmElement.innerText} | ACCURACY: ${accuracyElement.innerText}`;
    }

    function calculateStats() {
        const timeElapsed = 60 - timer;
        if (timeElapsed > 0) {
            const wpm = Math.round((correctTyped / 5) / (timeElapsed / 60));
            wpmElement.innerText = wpm >= 0 ? wpm : 0;
        }

        const accuracy = totalTyped > 0 ? Math.round((correctTyped / totalTyped) * 100) : 100;
        accuracyElement.innerText = `${accuracy}%`;
    }

    typingInput.addEventListener('input', () => {
        if (!isPlaying && typingInput.value.length > 0) {
            startGame();
        }

        const inputChars = typingInput.value.split('');
        const spanArray = textDisplay.querySelectorAll('span');
        correctTyped = 0;
        totalTyped = inputChars.length;

        spanArray.forEach((span, index) => {
            const char = inputChars[index];

            span.classList.remove('current', 'correct', 'incorrect');

            if (char == null) {
                if (index === inputChars.length) {
                    span.classList.add('current');
                }
            } else if (char === span.innerText) {
                span.classList.add('correct');
                correctTyped++;
            } else {
                span.classList.add('incorrect');
            }
        });

        calculateStats();

        if (inputChars.length >= currentText.length) {
            endGame();
        }
    });

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        const keyElement = document.querySelector(`.key[data-key="${key}"]`);
        if (keyElement) {
            keyElement.classList.add('active');
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        const keyElement = document.querySelector(`.key[data-key="${key}"]`);
        if (keyElement) {
            keyElement.classList.remove('active');
        }
    });

    restartBtn.addEventListener('click', initGame);

    initGame();
</script>

</body>
</html>
