<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Text Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050000;
            --card-bg: #120202;
            --border-red: #ff0033;
            --dark-red: #660014;
            --bright-red: #ff3355;
            --text-main: #ff4d4d;
            --text-dim: #881111;
            --glow-red: 0 0 10px rgba(255, 0, 51, 0.8), 0 0 20px rgba(255, 0, 51, 0.4);
        }

        * {
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.75) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border: 4px solid var(--border-red);
            box-shadow: var(--glow-red), inset 0 0 15px rgba(255, 0, 51, 0.3);
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            margin-top: 0;
            font-size: 1.3rem;
            color: var(--border-red);
            text-shadow: var(--glow-red);
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .display-screen {
            width: 100%;
            min-height: 250px;
            max-height: 400px;
            background-color: #000000;
            border: 2px solid var(--dark-red);
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.85rem;
            line-height: 1.8;
            color: #ffffff;
            text-shadow: 0 0 5px #ffffff, 0 0 10px var(--border-red);
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(255, 0, 51, 0.2);
        }

        /* Custom Scrollbar for Display */
        .display-screen::-webkit-scrollbar {
            width: 8px;
        }

        .display-screen::-webkit-scrollbar-track {
            background: #000000;
        }

        .display-screen::-webkit-scrollbar-thumb {
            background: var(--dark-red);
            border: 1px solid var(--border-red);
        }

        .text-input {
            width: 100%;
            height: 120px;
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            border: 2px solid var(--dark-red);
            background-color: #000000;
            color: var(--border-red);
            outline: none;
            resize: vertical;
            margin-bottom: 20px;
            box-shadow: inset 0 0 8px rgba(255, 0, 51, 0.3);
        }

        .text-input:focus {
            border-color: var(--border-red);
            box-shadow: var(--glow-red);
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            padding: 12px 20px;
            font-size: 0.65rem;
            border: 2px solid var(--border-red);
            background-color: var(--dark-red);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        button:hover {
            background-color: var(--border-red);
            box-shadow: var(--glow-red);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>[LYRIC_DISPLAY_TERMINAL]</h1>

    <div id="display-screen" class="display-screen">Enter lyrics or text below to display on terminal screen...</div>

    <textarea id="text-input" class="text-input" placeholder="PASTE LYRICS OR TYPE TEXT HERE..."></textarea>

    <div class="controls">
        <button id="clear-btn">CLEAR DISPLAY</button>
    </div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const displayScreen = document.getElementById('display-screen');
    const clearBtn = document.getElementById('clear-btn');

    // Live update screen as user types or pastes text
    textInput.addEventListener('input', () => {
        const value = textInput.value;
        if (value.trim() === '') {
            displayScreen.innerText = 'Enter lyrics or text below to display on terminal screen...';
        } else {
            displayScreen.innerText = value;
        }
    });

    // Clear display button handler
    clearBtn.addEventListener('click', () => {
        textInput.value = '';
        displayScreen.innerText = 'Enter lyrics or text below to display on terminal screen...';
        textInput.focus();
    });
</script>

</body>
</html>
