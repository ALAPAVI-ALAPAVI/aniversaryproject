<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Ship Destroyer</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050000;
            --card-bg: #120202;
            --border-red: #ff0033;
            --dark-red: #660014;
            --bright-red: #ff3355;
            --text-main: #ff4d4d;
            --text-dim: #881111;
            --glow-red: 0 0 10px rgba(255, 0, 51, 0.8), 0 0 20px rgba(255, 0, 51, 0.4);
        }

        * {
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.75) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border: 4px solid var(--border-red);
            box-shadow: var(--glow-red), inset 0 0 15px rgba(255, 0, 51, 0.3);
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 1.3rem;
            color: var(--border-red);
            text-shadow: var(--glow-red);
            text-align: center;
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 15px;
            background-color: #080000;
            border: 2px solid var(--dark-red);
            padding: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: bold;
            color: var(--border-red);
            text-shadow: var(--glow-red);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.5rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        #game-screen {
            width: 100%;
            height: 380px;
            background-color: #000000;
            border: 2px solid var(--dark-red);
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .enemy-ship {
            position: absolute;
            color: var(--bright-red);
            font-size: 0.75rem;
            white-space: nowrap;
            text-shadow: var(--glow-red);
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateX(-50%);
        }

        .enemy-ship::before {
            content: "<V>";
            font-weight: bold;
            color: #ff0033;
            margin-bottom: 2px;
        }

        .matched {
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff;
        }

        #player-ship {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 1.2rem;
            text-shadow: var(--glow-red);
            transition: left 0.1s ease-out;
        }

        .laser {
            position: absolute;
            width: 4px;
            background-color: var(--border-red);
            box-shadow: var(--glow-red);
            transform: translateX(-50%);
        }

        .explosion {
            position: absolute;
            color: #ffffff;
            font-size: 1.5rem;
            transform: translate(-50%, -50%);
            animation: explode 0.3s forwards;
        }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        .typing-input {
            width: 100%;
            padding: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            border: 2px solid var(--dark-red);
            background-color: #000000;
            color: var(--border-red);
            outline: none;
            margin-bottom: 15px;
            box-shadow: inset 0 0 8px rgba(255, 0, 51, 0.3);
            text-align: center;
        }

        .typing-input:focus {
            border-color: var(--border-red);
            box-shadow: var(--glow-red);
        }

        button {
            font-family: 'Press Start 2P', monospace;
            padding: 10px 18px;
            font-size: 0.65rem;
            border: 2px solid var(--border-red);
            background-color: var(--dark-red);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        button:hover {
            background-color: var(--border-red);
            box-shadow: var(--glow-red);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .game-over-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(5, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .game-over-title {
            color: var(--border-red);
            text-shadow: var(--glow-red);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>[SHIP_DESTROYER]</h1>

    <div class="stats-bar">
        <div class="stat-item">
            <div id="score" class="stat-value">0</div>
            <div class="stat-label">SCORE</div>
        </div>
        <div class="stat-item">
            <div id="health" class="stat-value">100%</div>
            <div class="stat-label">HULL INTEGRITY</div>
        </div>
        <div class="stat-item">
            <div id="wpm" class="stat-value">0</div>
            <div class="stat-label">WPM</div>
        </div>
    </div>

    <div id="game-screen">
        <div id="player-ship">A/\A</div>
        <div id="overlay" class="game-over-overlay" style="display: none;">
            <div id="overlay-title" class="game-over-title">SHIP DESTROYED</div>
            <button onclick="startGame()">RESTART MISSION</button>
        </div>
    </div>

    <input type="text" id="typing-input" class="typing-input" placeholder="TYPE WORD TO DESTROY..." autofocus autocomplete="off" spellcheck="false">

    <button id="start-btn">START MISSION</button>
</div>

<script>
    const wordList = [
        "laser", "destroy", "vector", "attack", "matrix", "shield", "orbit", 
        "nexus", "kernel", "binary", "system", "signal", "photon", "cyborg",
        "plasma", "rocket", "runner", "danger", "target", "render", "deploy",
        "module", "struct", "memory", "buffer", "static", "vector", "compile"
    ];

    let score = 0;
    let health = 100;
    let totalTypedWords = 0;
    let startTime = null;
    let enemies = [];
    let gameLoopInterval = null;
    let spawnInterval = null;
    let isPlaying = false;

    const gameScreen = document.getElementById('game-screen');
    const playerShip = document.getElementById('player-ship');
    const typingInput = document.getElementById('typing-input');
    const scoreElement = document.getElementById('score');
    const healthElement = document.getElementById('health');
    const wpmElement = document.getElementById('wpm');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');

    function startGame() {
        clearInterval(gameLoopInterval);
        clearInterval(spawnInterval);

        // Clear existing enemy elements
        enemies.forEach(e => e.element.remove());
        enemies = [];

        score = 0;
        health = 100;
        totalTypedWords = 0;
        startTime = Date.now();
        isPlaying = true;

        scoreElement.innerText = score;
        healthElement.innerText = health + '%';
        wpmElement.innerText = '0';
        overlay.style.display = 'none';
        typingInput.value = '';
        typingInput.disabled = false;
        typingInput.focus();

        gameLoopInterval = setInterval(updateGame, 50);
        spawnInterval = setInterval(spawnEnemy, 2000);
    }

    function spawnEnemy() {
        if (!isPlaying) return;

        const word = wordList[Math.floor(Math.random() * wordList.length)];
        const xPos = Math.floor(Math.random() * (gameScreen.clientWidth - 100)) + 50;

        const enemyElem = document.createElement('div');
        enemyElem.classList.add('enemy-ship');
        enemyElem.style.left = xPos + 'px';
        enemyElem.style.top = '0px';
        enemyElem.innerHTML = `<span>${word}</span>`;

        gameScreen.appendChild(enemyElem);

        enemies.push({
            word: word,
            x: xPos,
            y: 0,
            speed: 1.5 + Math.random() * 1.0,
            element: enemyElem
        });
    }

    function updateGame() {
        if (!isPlaying) return;

        const targetY = gameScreen.clientHeight - 40;

        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            enemy.y += enemy.speed;
            enemy.element.style.top = enemy.y + 'px';

            // Enemy reaches ship
            if (enemy.y >= targetY) {
                createExplosion(enemy.x, enemy.y);
                enemy.element.remove();
                enemies.splice(i, 1);
                
                health -= 20;
                healthElement.innerText = Math.max(0, health) + '%';

                if (health <= 0) {
                    endGame(false);
                }
            }
        }

        updateWPM();
    }

    function updateWPM() {
        if (!startTime) return;
        const elapsedMinutes = (Date.now() - startTime) / 60000;
        if (elapsedMinutes > 0) {
            const wpm = Math.round(totalTypedWords / elapsedMinutes);
            wpmElement.innerText = wpm;
        }
    }

    function fireLaser(targetX, targetY, callback) {
        const playerX = playerShip.offsetLeft + (playerShip.clientWidth / 2);
        playerShip.style.left = targetX + 'px';

        const laser = document.createElement('div');
        laser.classList.add('laser');
        laser.style.left = targetX + 'px';
        laser.style.bottom = '30px';
        laser.style.height = (gameScreen.clientHeight - targetY - 30) + 'px';

        gameScreen.appendChild(laser);

        setTimeout(() => {
            laser.remove();
            if (callback) callback();
        }, 100);
    }

    function createExplosion(x, y) {
        const exp = document.createElement('div');
        exp.classList.add('explosion');
        exp.innerText = '*#*';
        exp.style.left = x + 'px';
        exp.style.top = y + 'px';
        gameScreen.appendChild(exp);
        setTimeout(() => exp.remove(), 300);
    }

    function endGame(victory) {
        isPlaying = false;
        clearInterval(gameLoopInterval);
        clearInterval(spawnInterval);

        typingInput.disabled = true;
        overlay.style.display = 'flex';
        overlayTitle.innerText = victory ? "MISSION ACCOMPLISHED" : "SHIP DESTROYED";
    }

    typingInput.addEventListener('input', () => {
        if (!isPlaying) return;

        const currentInput = typingInput.value.trim().toLowerCase();

        // Highlight matching prefixes
        enemies.forEach(enemy => {
            if (enemy.word.startsWith(currentInput) && currentInput.length > 0) {
                const matched = enemy.word.substring(0, currentInput.length);
                const remaining = enemy.word.substring(currentInput.length);
                enemy.element.querySelector('span').innerHTML = `<span class="matched">${matched}</span>${remaining}`;
            } else {
                enemy.element.querySelector('span').innerText = enemy.word;
            }
        });

        // Check for complete word match
        const matchedIndex = enemies.findIndex(enemy => enemy.word === currentInput);

        if (matchedIndex !== -1) {
            const targetEnemy = enemies[matchedIndex];
            
            fireLaser(targetEnemy.x, targetEnemy.y, () => {
                createExplosion(targetEnemy.x, targetEnemy.y);
                targetEnemy.element.remove();
                enemies.splice(matchedIndex, 1);

                score += 100;
                totalTypedWords++;
                scoreElement.innerText = score;
                typingInput.value = '';
            });
        }
    });

    startBtn.addEventListener('click', startGame);
</script>

</body>
</html>
