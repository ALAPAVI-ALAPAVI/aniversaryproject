<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Lyric Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0000;
            --card-bg: #1a0505;
            --border-red: #ff1a40;
            --dark-red: #80001a;
            --bright-red: #ff4d6d;
            --text-main: #ff8095;
            --text-dim: #b3364b;
            --glow-red: 0 0 12px rgba(255, 26, 64, 0.9);
            --display-bg: #000000;
            --display-text: #ffffff;
            --input-text: #ff99aa;
        }

        * {
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border: 4px solid var(--border-red);
            box-shadow: var(--glow-red), inset 0 0 15px rgba(255, 26, 64, 0.3);
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--border-red);
            text-shadow: var(--glow-red);
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .view-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        .role-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .display-screen {
            width: 100%;
            min-height: 250px;
            max-height: 380px;
            background-color: var(--display-bg);
            border: 3px solid var(--border-red);
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--display-text);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8), 0 0 12px var(--border-red);
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(255, 26, 64, 0.25);
        }

        .display-screen::-webkit-scrollbar {
            width: 10px;
        }

        .display-screen::-webkit-scrollbar-track {
            background: #000000;
        }

        .display-screen::-webkit-scrollbar-thumb {
            background: var(--dark-red);
            border: 2px solid var(--border-red);
        }

        .input-field {
            width: 100%;
            padding: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            border: 2px solid var(--border-red);
            background-color: #000000;
            color: var(--input-text);
            outline: none;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(255, 26, 64, 0.3);
            text-align: center;
        }

        .text-area-input {
            height: 120px;
            resize: vertical;
            text-align: left;
            line-height: 1.5;
        }

        .input-field::placeholder {
            color: var(--text-dim);
        }

        .input-field:focus {
            border-color: var(--bright-red);
            box-shadow: var(--glow-red);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            padding: 12px 20px;
            font-size: 0.7rem;
            border: 2px solid var(--border-red);
            background-color: var(--dark-red);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        button:hover {
            background-color: var(--border-red);
            box-shadow: var(--glow-red);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .preview-title {
            align-self: flex-start;
            font-size: 0.7rem;
            color: var(--bright-red);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .error-msg {
            color: #ff3333;
            font-size: 0.65rem;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ROLE SELECTION PAGE -->
    <div id="role-page" class="view-section">
        <h1>[SYSTEM ACCESS]</h1>
        <p style="font-size: 0.7rem; margin-bottom: 25px; color: var(--text-dim);">SELECT YOUR ACCESS LEVEL</p>
        <div class="role-selection">
            <button id="select-viewer-btn">VIEWER</button>
            <button id="select-admin-btn">ADMIN</button>
        </div>
    </div>

    <!-- VIEWER AUTH -->
    <div id="viewer-auth-page" class="view-section hidden">
        <h1>[VIEWER AUTHENTICATION]</h1>
        <input type="password" id="viewer-pass-input" class="input-field" placeholder="ENTER VIEWER PASSWORD" autofocus>
        <div id="viewer-auth-error" class="error-msg hidden">INVALID PASSWORD</div>
        <div class="controls">
            <button id="viewer-login-btn">ACCESS</button>
            <button id="viewer-back-btn">BACK</button>
        </div>
    </div>

    <!-- ADMIN AUTH -->
    <div id="admin-auth-page" class="view-section hidden">
        <h1>[ADMIN AUTHENTICATION]</h1>
        <input type="password" id="admin-pass-input" class="input-field" placeholder="ENTER ADMIN PASSWORD" autofocus>
        <div id="admin-auth-error" class="error-msg hidden">INVALID PASSWORD</div>
        <div class="controls">
            <button id="admin-login-btn">ACCESS</button>
            <button id="admin-back-btn">BACK</button>
        </div>
    </div>

    <!-- VIEWER UI -->
    <div id="viewer-ui" class="view-section hidden">
        <h1>[LIVE LYRIC SCREEN]</h1>
        <div id="viewer-display" class="display-screen">Awaiting broadcast...</div>
        <div class="controls">
            <button id="viewer-logout-btn">LOGOUT</button>
        </div>
    </div>

    <!-- ADMIN UI -->
    <div id="admin-ui" class="view-section hidden">
        <h1>[ADMIN TERMINAL]</h1>
        
        <div class="preview-title">LIVE PREVIEW SCREEN:</div>
        <div id="admin-preview-display" class="display-screen">Awaiting broadcast...</div>

        <textarea id="admin-text-input" class="input-field text-area-input" placeholder="PASTE OR TYPE LYRICS HERE..."></textarea>
        
        <div class="controls">
            <button id="broadcast-btn">BROADCAST LYRICS</button>
            <button id="admin-clear-btn">CLEAR</button>
            <button id="admin-logout-btn">LOGOUT</button>
        </div>
    </div>

</div>

<script>
    // Configurable Passwords
    const VIEWER_PASSWORD = "viewer";
    const ADMIN_PASSWORD = "admin";

    // Speed setting for typewriter (~20ms)
    const TYPING_SPEED = 20;

    // Local Storage Key for persistent sync across tabs
    const STORAGE_KEY = "retro_lyric_broadcast";

    // View Elements
    const rolePage = document.getElementById('role-page');
    const viewerAuthPage = document.getElementById('viewer-auth-page');
    const adminAuthPage = document.getElementById('admin-auth-page');
    const viewerUi = document.getElementById('viewer-ui');
    const adminUi = document.getElementById('admin-ui');

    // Inputs & Controls
    const selectViewerBtn = document.getElementById('select-viewer-btn');
    const selectAdminBtn = document.getElementById('select-admin-btn');
    
    const viewerPassInput = document.getElementById('viewer-pass-input');
    const viewerLoginBtn = document.getElementById('viewer-login-btn');
    const viewerBackBtn = document.getElementById('viewer-back-btn');
    const viewerAuthError = document.getElementById('viewer-auth-error');

    const adminPassInput = document.getElementById('admin-pass-input');
    const adminLoginBtn = document.getElementById('admin-login-btn');
    const adminBackBtn = document.getElementById('admin-back-btn');
    const adminAuthError = document.getElementById('admin-auth-error');

    const viewerDisplay = document.getElementById('viewer-display');
    const adminPreviewDisplay = document.getElementById('admin-preview-display');
    const adminTextInput = document.getElementById('admin-text-input');
    
    const broadcastBtn = document.getElementById('broadcast-btn');
    const adminClearBtn = document.getElementById('admin-clear-btn');
    const adminLogoutBtn = document.getElementById('admin-logout-btn');
    const viewerLogoutBtn = document.getElementById('viewer-logout-btn');

    let viewerTypeInterval = null;
    let adminTypeInterval = null;

    function hideAllPages() {
        rolePage.classList.add('hidden');
        viewerAuthPage.classList.add('hidden');
        adminAuthPage.classList.add('hidden');
        viewerUi.classList.add('hidden');
        adminUi.classList.add('hidden');
    }

    function startTypewriter(element, text, intervalRefSetter) {
        element.innerText = '';
        if (!text) return;

        let currentIndex = 0;
        const interval = setInterval(() => {
            element.innerText += text.charAt(currentIndex);
            currentIndex++;
            element.scrollTop = element.scrollHeight;

            if (currentIndex >= text.length) {
                clearInterval(interval);
            }
        }, TYPING_SPEED);

        intervalRefSetter(interval);
    }

    function renderBroadcast(text) {
        clearInterval(viewerTypeInterval);
        clearInterval(adminTypeInterval);

        if (!viewerUi.classList.contains('hidden')) {
            startTypewriter(viewerDisplay, text, (inv) => viewerTypeInterval = inv);
        }

        if (!adminUi.classList.contains('hidden')) {
            startTypewriter(adminPreviewDisplay, text, (inv) => adminTypeInterval = inv);
        }
    }

    // Role Navigation
    selectViewerBtn.addEventListener('click', () => {
        hideAllPages();
        viewerAuthPage.classList.remove('hidden');
        viewerPassInput.value = '';
        viewerAuthError.classList.add('hidden');
        viewerPassInput.focus();
    });

    selectAdminBtn.addEventListener('click', () => {
        hideAllPages();
        adminAuthPage.classList.remove('hidden');
        adminPassInput.value = '';
        adminAuthError.classList.add('hidden');
        adminPassInput.focus();
    });

    viewerBackBtn.addEventListener('click', () => {
        hideAllPages();
        rolePage.classList.remove('hidden');
    });

    adminBackBtn.addEventListener('click', () => {
        hideAllPages();
        rolePage.classList.remove('hidden');
    });

    // Auth Handlers
    viewerLoginBtn.addEventListener('click', () => {
        if (viewerPassInput.value === VIEWER_PASSWORD) {
            hideAllPages();
            viewerUi.classList.remove('hidden');
            const currentBroadcast = localStorage.getItem(STORAGE_KEY) || "Awaiting broadcast...";
            renderBroadcast(currentBroadcast);
        } else {
            viewerAuthError.classList.remove('hidden');
        }
    });

    adminLoginBtn.addEventListener('click', () => {
        if (adminPassInput.value === ADMIN_PASSWORD) {
            hideAllPages();
            adminUi.classList.remove('hidden');
            const currentBroadcast = localStorage.getItem(STORAGE_KEY) || "Awaiting broadcast...";
            adminTextInput.value = currentBroadcast === "Awaiting broadcast..." ? "" : currentBroadcast;
            renderBroadcast(currentBroadcast);
        } else {
            adminAuthError.classList.remove('hidden');
        }
    });

    // Logout Handlers
    viewerLogoutBtn.addEventListener('click', () => {
        clearInterval(viewerTypeInterval);
        hideAllPages();
        rolePage.classList.remove('hidden');
    });

    adminLogoutBtn.addEventListener('click', () => {
        clearInterval(adminTypeInterval);
        hideAllPages();
        rolePage.classList.remove('hidden');
    });

    // Admin Broadcast Action
    broadcastBtn.addEventListener('click', () => {
        const text = adminTextInput.value.trim() === '' ? 'Awaiting broadcast...' : adminTextInput.value;
        localStorage.setItem(STORAGE_KEY, text);
        renderBroadcast(text);
    });

    adminClearBtn.addEventListener('click', () => {
        adminTextInput.value = '';
        const defaultText = 'Awaiting broadcast...';
        localStorage.setItem(STORAGE_KEY, defaultText);
        renderBroadcast(defaultText);
    });

    // Listen for storage updates across tabs/windows in real time
    window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) {
            renderBroadcast(e.newValue || 'Awaiting broadcast...');
        }
    });
</script>

</body>
</html>
