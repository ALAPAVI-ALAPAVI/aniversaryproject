<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Lyric Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0000;
            --card-bg: #1a0505;
            --border-red: #ff1a40;
            --dark-red: #80001a;
            --bright-red: #ff4d6d;
            --text-main: #ff8095;
            --text-dim: #b3364b;
            --glow-red: 0 0 12px rgba(255, 26, 64, 0.9);
            --display-bg: #000000;
            --display-text: #ffffff;
            --input-text: #ff99aa;
        }

        * {
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border: 4px solid var(--border-red);
            box-shadow: var(--glow-red), inset 0 0 15px rgba(255, 26, 64, 0.3);
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--border-red);
            text-shadow: var(--glow-red);
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .view-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        .role-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .display-screen {
            width: 100%;
            min-height: 220px;
            max-height: 320px;
            background-color: var(--display-bg);
            border: 3px solid var(--border-red);
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--display-text);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8), 0 0 12px var(--border-red);
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(255, 26, 64, 0.25);
        }

        .display-screen::-webkit-scrollbar, .library-list::-webkit-scrollbar {
            width: 8px;
        }

        .display-screen::-webkit-scrollbar-track, .library-list::-webkit-scrollbar-track {
            background: #000000;
        }

        .display-screen::-webkit-scrollbar-thumb, .library-list::-webkit-scrollbar-thumb {
            background: var(--dark-red);
            border: 1px solid var(--border-red);
        }

        .input-field {
            width: 100%;
            padding: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            border: 2px solid var(--border-red);
            background-color: #000000;
            color: var(--input-text);
            outline: none;
            margin-bottom: 12px;
            box-shadow: inset 0 0 10px rgba(255, 26, 64, 0.3);
            text-align: center;
        }

        .text-area-input {
            height: 100px;
            resize: vertical;
            text-align: left;
            line-height: 1.5;
        }

        .input-field::placeholder {
            color: var(--text-dim);
        }

        .input-field:focus {
            border-color: var(--bright-red);
            box-shadow: var(--glow-red);
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            padding: 10px 16px;
            font-size: 0.65rem;
            border: 2px solid var(--border-red);
            background-color: var(--dark-red);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        button:hover {
            background-color: var(--border-red);
            box-shadow: var(--glow-red);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .section-title {
            align-self: flex-start;
            font-size: 0.7rem;
            color: var(--bright-red);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .error-msg {
            color: #ff3333;
            font-size: 0.65rem;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Library Styling */
        .library-container {
            width: 100%;
            border: 2px solid var(--dark-red);
            background-color: #000000;
            padding: 15px;
            margin-bottom: 20px;
        }

        .library-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .library-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #120202;
            border: 1px solid var(--border-red);
            padding: 8px 12px;
            font-size: 0.65rem;
        }

        .library-item-title {
            color: var(--bright-red);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 250px;
        }

        .library-item-pass {
            color: var(--text-dim);
            font-size: 0.55rem;
            margin-left: 8px;
        }

        .library-actions {
            display: flex;
            gap: 6px;
        }

        .library-actions button {
            padding: 6px 10px;
            font-size: 0.55rem;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ROLE SELECTION PAGE -->
    <div id="role-page" class="view-section">
        <h1>[SYSTEM ACCESS]</h1>
        <p style="font-size: 0.7rem; margin-bottom: 25px; color: var(--text-dim);">SELECT YOUR ACCESS LEVEL</p>
        <div class="role-selection">
            <button id="select-viewer-btn">VIEWER</button>
            <button id="select-admin-btn">ADMIN</button>
        </div>
    </div>

    <!-- VIEWER AUTH -->
    <div id="viewer-auth-page" class="view-section hidden">
        <h1>[VIEWER AUTHENTICATION]</h1>
        <input type="password" id="viewer-pass-input" class="input-field" placeholder="ENTER LYRIC PASSWORD" autofocus>
        <div id="viewer-auth-error" class="error-msg hidden">INVALID PASSWORD</div>
        <div class="controls">
            <button id="viewer-login-btn">ACCESS</button>
            <button id="viewer-back-btn">BACK</button>
        </div>
    </div>

    <!-- ADMIN AUTH -->
    <div id="admin-auth-page" class="view-section hidden">
        <h1>[ADMIN AUTHENTICATION]</h1>
        <input type="password" id="admin-pass-input" class="input-field" placeholder="ENTER ADMIN PASSWORD" autofocus>
        <div id="admin-auth-error" class="error-msg hidden">INVALID PASSWORD</div>
        <div class="controls">
            <button id="admin-login-btn">ACCESS</button>
            <button id="admin-back-btn">BACK</button>
        </div>
    </div>

    <!-- VIEWER UI -->
    <div id="viewer-ui" class="view-section hidden">
        <h1>[LIVE LYRIC SCREEN]</h1>
        <div id="viewer-display" class="display-screen">Awaiting broadcast...</div>
        <div class="controls">
            <button id="viewer-logout-btn">LOGOUT</button>
        </div>
    </div>

    <!-- ADMIN UI -->
    <div id="admin-ui" class="view-section hidden">
        <h1>[ADMIN TERMINAL]</h1>
        
        <div class="section-title">LIVE PREVIEW SCREEN:</div>
        <div id="admin-preview-display" class="display-screen">Awaiting broadcast...</div>

        <!-- LIBRARY SECTION -->
        <div class="section-title">LYRIC LIBRARY:</div>
        <div class="library-container">
            <div id="library-list" class="library-list"></div>
            <input type="text" id="song-title-input" class="input-field" placeholder="TITLE / SONG NAME" style="text-align: left; margin-bottom: 8px;">
            <input type="text" id="song-pass-input" class="input-field" placeholder="ASSIGN VIEWER PASSWORD FOR THIS LYRIC" style="text-align: left; margin-bottom: 8px;">
            <textarea id="admin-text-input" class="input-field text-area-input" placeholder="PASTE OR TYPE LYRICS HERE..."></textarea>
            <div class="controls" style="margin-top: 5px;">
                <button id="save-library-btn">SAVE TO LIBRARY</button>
                <button id="broadcast-btn">BROADCAST LYRICS</button>
                <button id="admin-clear-btn">CLEAR</button>
            </div>
        </div>
        
        <div class="controls">
            <button id="admin-logout-btn">LOGOUT</button>
        </div>
    </div>

</div>

<script>
    // Configurable Admin Master Password
    const ADMIN_PASSWORD = "admin";

    // Slowed-down typewriter pace (75ms per character)
    const TYPING_SPEED = 75;

    // Storage Keys
    const BROADCAST_KEY = "retro_lyric_broadcast";
    const LIBRARY_KEY = "retro_lyric_library";

    // View Elements
    const rolePage = document.getElementById('role-page');
    const viewerAuthPage = document.getElementById('viewer-auth-page');
    const adminAuthPage = document.getElementById('admin-auth-page');
    const viewerUi = document.getElementById('viewer-ui');
    const adminUi = document.getElementById('admin-ui');

    // Inputs & Controls
    const selectViewerBtn = document.getElementById('select-viewer-btn');
    const selectAdminBtn = document.getElementById('select-admin-btn');
    
    const viewerPassInput = document.getElementById('viewer-pass-input');
    const viewerLoginBtn = document.getElementById('viewer-login-btn');
    const viewerBackBtn = document.getElementById('viewer-back-btn');
    const viewerAuthError = document.getElementById('viewer-auth-error');

    const adminPassInput = document.getElementById('admin-pass-input');
    const adminLoginBtn = document.getElementById('admin-login-btn');
    const adminBackBtn = document.getElementById('admin-back-btn');
    const adminAuthError = document.getElementById('admin-auth-error');

    const viewerDisplay = document.getElementById('viewer-display');
    const adminPreviewDisplay = document.getElementById('admin-preview-display');
    const adminTextInput = document.getElementById('admin-text-input');
    const songTitleInput = document.getElementById('song-title-input');
    const songPassInput = document.getElementById('song-pass-input');
    const libraryList = document.getElementById('library-list');
    
    const saveLibraryBtn = document.getElementById('save-library-btn');
    const broadcastBtn = document.getElementById('broadcast-btn');
    const adminClearBtn = document.getElementById('admin-clear-btn');
    const adminLogoutBtn = document.getElementById('admin-logout-btn');
    const viewerLogoutBtn = document.getElementById('viewer-logout-btn');

    let viewerTypeInterval = null;
    let adminTypeInterval = null;
    let activeViewerPassword = null;

    function hideAllPages() {
        rolePage.classList.add('hidden');
        viewerAuthPage.classList.add('hidden');
        adminAuthPage.classList.add('hidden');
        viewerUi.classList.add('hidden');
        adminUi.classList.add('hidden');
    }

    function startTypewriter(element, text, intervalRefSetter) {
        element.innerText = '';
        if (!text) return;

        let currentIndex = 0;
        const interval = setInterval(() => {
            element.innerText += text.charAt(currentIndex);
            currentIndex++;
            element.scrollTop = element.scrollHeight;

            if (currentIndex >= text.length) {
                clearInterval(interval);
            }
        }, TYPING_SPEED);

        intervalRefSetter(interval);
    }

    function renderBroadcast(broadcastData) {
        clearInterval(viewerTypeInterval);
        clearInterval(adminTypeInterval);

        const text = (broadcastData && broadcastData.text) ? broadcastData.text : "Awaiting broadcast...";

        if (!viewerUi.classList.contains('hidden')) {
            startTypewriter(viewerDisplay, text, (inv) => viewerTypeInterval = inv);
        }

        if (!adminUi.classList.contains('hidden')) {
            startTypewriter(adminPreviewDisplay, text, (inv) => adminTypeInterval = inv);
        }
    }

    function getBroadcastData() {
        const data = localStorage.getItem(BROADCAST_KEY);
        return data ? JSON.parse(data) : null;
    }

    // Library Functions
    function getLibrary() {
        const saved = localStorage.getItem(LIBRARY_KEY);
        return saved ? JSON.parse(saved) : [];
    }

    function saveLibrary(library) {
        localStorage.setItem(LIBRARY_KEY, JSON.stringify(library));
        renderLibrary();
    }

    function renderLibrary() {
        const library = getLibrary();
        libraryList.innerHTML = '';

        if (library.length === 0) {
            libraryList.innerHTML = '<div style="font-size:0.6rem; color:var(--text-dim); text-align:center;">NO SAVED LYRICS IN LIBRARY</div>';
            return;
        }

        library.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'library-item';
            div.innerHTML = `
                <div>
                    <span class="library-item-title">${item.title}</span>
                    <span class="library-item-pass">[PASS: ${item.password || 'NONE'}]</span>
                </div>
                <div class="library-actions">
                    <button onclick="loadLibraryItem(${index})">LOAD</button>
                    <button onclick="deleteLibraryItem(${index})">DELETE</button>
                </div>
            `;
            libraryList.appendChild(div);
        });
    }

    window.loadLibraryItem = (index) => {
        const library = getLibrary();
        const item = library[index];
        if (item) {
            songTitleInput.value = item.title;
            songPassInput.value = item.password || '';
            adminTextInput.value = item.text;
        }
    };

    window.deleteLibraryItem = (index) => {
        const library = getLibrary();
        library.splice(index, 1);
        saveLibrary(library);
    };

    saveLibraryBtn.addEventListener('click', () => {
        const title = songTitleInput.value.trim() || 'UNTITLED';
        const password = songPassInput.value.trim();
        const text = adminTextInput.value.trim();

        if (!text) return;

        const library = getLibrary();
        library.push({ title, password, text });
        saveLibrary(library);

        songTitleInput.value = '';
        songPassInput.value = '';
    });

    // Role Navigation
    selectViewerBtn.addEventListener('click', () => {
        hideAllPages();
        viewerAuthPage.classList.remove('hidden');
        viewerPassInput.value = '';
        viewerAuthError.classList.add('hidden');
        viewerPassInput.focus();
    });

    selectAdminBtn.addEventListener('click', () => {
        hideAllPages();
        adminAuthPage.classList.remove('hidden');
        adminPassInput.value = '';
        adminAuthError.classList.add('hidden');
        adminPassInput.focus();
    });

    viewerBackBtn.addEventListener('click', () => {
        hideAllPages();
        rolePage.classList.remove('hidden');
    });

    adminBackBtn.addEventListener('click', () => {
        hideAllPages();
        rolePage.classList.remove('hidden');
    });

    // Auth Handlers
    viewerLoginBtn.addEventListener('click', () => {
        const enteredPass = viewerPassInput.value.trim();
        const broadcastData = getBroadcastData();

        // Check if entered password matches broadcast password (or if no password set/default allowed)
        if (broadcastData && broadcastData.password) {
            if (enteredPass === broadcastData.password) {
                hideAllPages();
                viewerUi.classList.remove('hidden');
                activeViewerPassword = enteredPass;
                renderBroadcast(broadcastData);
            } else {
                viewerAuthError.classList.remove('hidden');
            }
        } else {
            // Default fallback if broadcast password is empty or default
            if (enteredPass === "viewer" || !broadcastData || !broadcastData.password) {
                hideAllPages();
                viewerUi.classList.remove('hidden');
                activeViewerPassword = enteredPass;
                renderBroadcast(broadcastData || { text: "Awaiting broadcast..." });
            } else {
                viewerAuthError.classList.remove('hidden');
            }
        }
    });

    adminLoginBtn.addEventListener('click', () => {
        if (adminPassInput.value === ADMIN_PASSWORD) {
            hideAllPages();
            adminUi.classList.remove('hidden');
            renderLibrary();
            const currentBroadcast = getBroadcastData();
            if (currentBroadcast) {
                adminTextInput.value = currentBroadcast.text || "";
                songPassInput.value = currentBroadcast.password || "";
            }
            renderBroadcast(currentBroadcast);
        } else {
            adminAuthError.classList.remove('hidden');
        }
    });

    // Logout Handlers
    viewerLogoutBtn.addEventListener('click', () => {
        clearInterval(viewerTypeInterval);
        activeViewerPassword = null;
        hideAllPages();
        rolePage.classList.remove('hidden');
    });

    adminLogoutBtn.addEventListener('click', () => {
        clearInterval(adminTypeInterval);
        hideAllPages();
        rolePage.classList.remove('hidden');
    });

    // Admin Broadcast Action
    broadcastBtn.addEventListener('click', () => {
        const text = adminTextInput.value.trim() === '' ? 'Awaiting broadcast...' : adminTextInput.value;
        const password = songPassInput.value.trim();
        const broadcastData = { text, password };
        localStorage.setItem(BROADCAST_KEY, JSON.stringify(broadcastData));
        renderBroadcast(broadcastData);
    });

    adminClearBtn.addEventListener('click', () => {
        adminTextInput.value = '';
        songTitleInput.value = '';
        songPassInput.value = '';
        const defaultData = { text: 'Awaiting broadcast...', password: '' };
        localStorage.setItem(BROADCAST_KEY, JSON.stringify(defaultData));
        renderBroadcast(defaultData);
    });

    // Listen for storage updates across tabs/windows in real time
    window.addEventListener('storage', (e) => {
        if (e.key === BROADCAST_KEY) {
            const data = e.newValue ? JSON.parse(e.newValue) : null;
            renderBroadcast(data);
        }
    });
</script>

</body>
</html>
